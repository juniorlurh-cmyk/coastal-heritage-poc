# Coastal Heritage — nginx site config
# Place at: /etc/nginx/sites-available/coastal-heritage
# Enable:   sudo ln -s /etc/nginx/sites-available/coastal-heritage /etc/nginx/sites-enabled/
#           sudo nginx -t && sudo systemctl reload nginx
#
# Replace coastalheritage.co.za with your real domain (or free subdomain).

server {
    listen 80;
    listen [::]:80;
    server_name coastalheritage.co.za www.coastalheritage.co.za;

    root /var/www/coastal-heritage;
    index index.html;

    # Gzip for text assets
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml text/plain;
    gzip_min_length 1024;

    # Long-lived cache for fingerprinted build assets
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # SPA routing: real files win, everything else falls back to index.html.
    # This is what makes /about, /services, /projects, /contact work as real URLs.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Basic security headers
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    # noindex is also set in the HTML <head> for the preview stage;
    # remove both after go-live approval.
}

